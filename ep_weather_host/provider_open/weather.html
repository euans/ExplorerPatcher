<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="light dark">
<title>ExplorerPatcher Weather</title>
<style>
/* The host emulates prefers-color-scheme to match the flyout's light/dark setting. */
:root {
  --text:    #1a1a1a;
  --muted:   #5f6368;
  --card:    rgba(0, 0, 0, 0.045);
  --line:    rgba(0, 0, 0, 0.10);
  --accent:  #096bda;
  --warn:    #b85c00;
}
@media (prefers-color-scheme: dark) {
  :root {
    --text:    #f3f3f3;
    --muted:   #a7abb2;
    --card:    rgba(255, 255, 255, 0.06);
    --line:    rgba(255, 255, 255, 0.12);
    --accent:  #43a7ff;
    --warn:    #ffb15c;
  }
}
html {
  background-color: transparent !important;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
}
body {
  font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
  font-size: 13px;
  color: var(--text);
  cursor: default;
  user-select: none;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

#app {
  box-sizing: border-box;
  height: 100%;
  padding: 14px 18px 10px;
  display: grid;
  grid-template-columns: minmax(190px, 30%) 1fr;
  grid-template-rows: 1fr auto;
  column-gap: 20px;
}
#app[hidden] { display: none; }

/* current conditions */
.now { display: flex; flex-direction: column; min-width: 0; padding-top: 2px; }
.now-main { display: flex; align-items: center; gap: 8px; }
.now-icon { width: 76px; height: 76px; flex: none; }
.now-temp { font-size: 54px; font-weight: 300; line-height: 1; letter-spacing: -1px; white-space: nowrap; }
.now-temp small { font-size: 20px; font-weight: 400; vertical-align: top; position: relative; top: 4px; margin-left: 2px; color: var(--muted); letter-spacing: 0; }
.now-text { margin-top: 6px; font-size: 16px; font-weight: 600; }
.now-place { margin-top: 2px; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.facts { margin: 14px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 12.5px; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }

/* forecast */
.fc { display: flex; flex-direction: column; min-width: 0; min-height: 0; gap: 10px; }
.hourly { display: flex; gap: 4px; }
.hour { flex: 1 1 0; min-width: 0; background: var(--card); border-radius: 8px; padding: 7px 2px 6px; text-align: center; }
.hour .t { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.hour img { width: 30px; height: 30px; display: block; margin: 3px auto 1px; }
.hour .v { font-weight: 600; font-size: 13px; }
.hour .p { color: var(--accent); font-size: 11px; height: 13px; }
.daily { display: flex; flex-direction: column; background: var(--card); border-radius: 8px; padding: 2px 10px; min-height: 0; }
.day { display: grid; grid-template-columns: 62px 30px 38px 1fr 76px; align-items: center; column-gap: 6px; height: 33px; border-bottom: 1px solid var(--line); }
.day:last-child { border-bottom: 0; }
.day .d { font-weight: 600; white-space: nowrap; }
.day img { width: 26px; height: 26px; }
.day .p { color: var(--accent); font-size: 11.5px; text-align: right; }
.day .bar { position: relative; height: 5px; border-radius: 3px; background: var(--line); margin: 0 10px 0 6px; }
.day .bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: linear-gradient(90deg, #4aa3ff, #ffb300); }
.day .r { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.day .r b { font-weight: 600; }
.day .r span { color: var(--muted); margin-left: 8px; }

footer { grid-column: 1 / -1; padding-top: 7px; color: var(--muted); font-size: 11px; display: flex; justify-content: space-between; gap: 12px; }

/* message state (missing key etc.) */
#msg { box-sizing: border-box; height: 100%; padding: 26px 34px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 6px; }
#msg[hidden] { display: none; }
#msg img { width: 72px; height: 72px; opacity: .9; }
#msg h2 { margin: 6px 0 0; font-size: 18px; font-weight: 600; }
#msg p { margin: 0; max-width: 480px; line-height: 1.5; color: var(--muted); }
#msg code { color: var(--warn); }

/* White-only icon sets (white, material) are inverted on the light theme so they stay visible. */
:root.mono-icons img { filter: invert(1); }
@media (prefers-color-scheme: dark) { :root.mono-icons img { filter: none; } }
</style>
</head>
<body>
<div id="app" hidden>
  <section class="now">
    <div class="now-main">
      <img class="now-icon" id="nowIcon" alt="">
      <div class="now-temp"><span id="temp"></span><small id="unit"></small></div>
    </div>
    <div class="now-text" id="text"></div>
    <div class="now-place" id="place"></div>
    <dl class="facts" id="facts"></dl>
  </section>
  <section class="fc">
    <div class="hourly" id="hourly"></div>
    <div class="daily" id="daily"></div>
  </section>
  <footer><span id="source"></span><span id="updated"></span></footer>
</div>
<div id="msg" hidden>
  <img id="msgIcon" alt="">
  <h2 id="msgTitle"></h2>
  <p id="msgBody"></p>
</div>
<!--EP_SCRIPT-->
</body>
</html>
